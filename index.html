<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">

<style>
:root{--sky:#cfe9f7;--ink:#2a2f22;--leaf:#4f8a2c;--card:#fffdf7;--line:#d9dccf}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Sans","Yu Gothic",sans-serif;font-weight:500;line-height:1.8;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--leaf);padding:24px 20px 28px}
.logo{display:block;width:min(100%,420px);height:auto;margin:0 auto 8px}
h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:var(--leaf);font-size:26px;line-height:1.3;margin:0 0 4px;text-align:center}
h2{font-size:18px;font-weight:800;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
p,li{font-size:15px;margin:0 0 8px}
ul{padding-left:1.4em;margin:0 0 8px}
a{color:var(--leaf);font-weight:800;word-break:break-all}
.app{display:flex;gap:16px;align-items:flex-start}
.app img{width:72px;height:72px;border-radius:16px;border:2px solid var(--ink);flex:none}
.status{font-weight:800}
.app h3{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:20px;color:var(--leaf);margin:0 0 4px;line-height:1.3}
